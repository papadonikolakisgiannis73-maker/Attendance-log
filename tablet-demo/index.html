<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12160f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ΠΑΡΟΥΣΙΟΛΟΓΙΟ — STORE 311</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- HOME -->
      <section id="screen-home" class="screen active" aria-label="Αρχική">
        <header class="brand">
          <span class="brand-store">STORE 311</span>
          <h1 class="brand-title">ΠΑΡΟΥΣΙΟΛΟΓΙΟ</h1>
          <p class="brand-sub">Απλό παρουσιολόγιο για tablet — χωρίς Excel, χωρίς internet.</p>
        </header>

        <div class="home-clock">
          <div class="home-date" id="home-date">—</div>
          <div class="home-time" id="home-time">—</div>
          <p class="home-hint">Η ώρα έρχεται από το ρολόι του tablet.</p>
        </div>

        <div class="cta-stack">
          <button type="button" class="btn btn-primary" id="btn-today">ΣΗΜΕΡΑ</button>
          <button type="button" class="btn btn-ghost" id="btn-continue" hidden>
            Συνέχεια σημερινής
          </button>
        </div>
      </section>

      <!-- DAY BOARD -->
      <section id="screen-day" class="screen" aria-label="Ημέρα">
        <div class="topbar">
          <button type="button" class="icon-btn" id="btn-back-home" aria-label="Αρχική">←</button>
          <h1>Ημέρα</h1>
          <button type="button" class="icon-btn" id="btn-print" aria-label="Εκτύπωση">⎙</button>
        </div>
        <div class="day-meta">
          <strong id="day-date">—</strong>
          <span id="day-clock">—</span>
        </div>
        <div class="board" id="board"></div>
        <div class="fab-bar">
          <button type="button" class="btn btn-ghost" id="btn-clear-day">Καθαρισμός</button>
          <button type="button" class="btn btn-primary" id="btn-back-home-2" onclick="document.getElementById('btn-back-home').click()">Αρχική</button>
        </div>
      </section>

      <!-- PERSON -->
      <section id="screen-person" class="screen" aria-label="Άτομο">
        <div class="topbar">
          <button type="button" class="icon-btn" id="btn-back-day" aria-label="Πίσω">←</button>
          <h1>Ώρες</h1>
          <span style="width: 52px"></span>
        </div>

        <div class="person-hero">
          <div class="post-label" id="person-post">—</div>
          <h2 id="person-name">—</h2>
          <div class="dept" id="person-dept">—</div>
          <button type="button" class="btn btn-ghost btn-change-name" id="btn-change-name">
            Αλλαγή ονόματος
          </button>
        </div>

        <div class="time-block">
          <button type="button" class="stamp-btn stamp-arrive" id="btn-arrive">
            ΑΦΙΞΗ
            <small>τώρα από το ρολόι</small>
          </button>
          <button type="button" class="time-chip" id="btn-edit-arrive" aria-label="Επεξεργασία άφιξης">
            <span class="time-chip-label">Ώρα άφιξης</span>
            <span class="time-chip-value" id="person-arrive">—</span>
            <span class="time-chip-hint">πάτησε για διόρθωση</span>
          </button>
        </div>

        <div class="time-block">
          <button type="button" class="stamp-btn stamp-leave" id="btn-leave">
            ΑΠΟΧΩΡΗΣΗ
            <small>τώρα από το ρολόι</small>
          </button>
          <button type="button" class="time-chip" id="btn-edit-leave" aria-label="Επεξεργασία αποχώρησης">
            <span class="time-chip-label">Ώρα αποχώρησης</span>
            <span class="time-chip-value" id="person-leave">—</span>
            <span class="time-chip-hint">πάτησε για διόρθωση</span>
          </button>
        </div>

        <div class="hours-panel">
          <div class="label">Σύνολο ωρών (και overnight)</div>
          <div class="value" id="person-hours">—</div>
        </div>

        <div class="cta-stack">
          <button type="button" class="btn btn-danger" id="btn-remove">Αφαίρεση από πόστο</button>
        </div>
      </section>
    </div>

    <!-- NAME PICKER -->
    <div class="overlay" id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="sheet">
        <div class="topbar">
          <h2 id="picker-title">Επιλογή ονόματος</h2>
          <button type="button" class="icon-btn" id="btn-close-picker" aria-label="Κλείσιμο">✕</button>
        </div>
        <p class="sheet-sub" id="picker-sub"></p>
        <input
          class="search"
          id="picker-search"
          type="search"
          placeholder="Αναζήτηση ονόματος…"
          autocomplete="off"
        />
        <div class="name-list" id="name-list"></div>
      </div>
    </div>

    <!-- TIME PICKER -->
    <div class="overlay" id="time-picker" role="dialog" aria-modal="true" aria-labelledby="time-picker-title">
      <div class="sheet">
        <div class="topbar">
          <h2 id="time-picker-title">Επιλογή ώρας</h2>
          <button type="button" class="icon-btn" id="btn-close-time" aria-label="Κλείσιμο">✕</button>
        </div>
        <p class="sheet-sub" id="time-picker-sub">Κάθε 15 λεπτά</p>
        <div class="time-actions">
          <button type="button" class="btn btn-ghost" id="btn-clear-time">Καθαρισμός ώρας</button>
        </div>
        <div class="time-list" id="time-list"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <div class="print-only" id="print-root"></div>

    <script src="employees.js"></script>
    <script src="app.js"></script>
  </body>
</html>
